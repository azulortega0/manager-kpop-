<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegación SPA </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        #content {
            border: 1px solid #b83131;
            padding: 20px;
            margin-top: 10px;
        }
        button {
            margin-right: 10px;
            padding: 10px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<center>
    <h1>Navegación SPA Ortega Romero</h1>

    <button onclick="showHome()">Inicio</button>
    <button onclick="showAbout()">Acerca de</button>

    <div id="content">
        <p>Bienvenido a la página. Haz clic en los botones para cambiar el contenido.</p>
    </div>

    <script>
        function showHome() {
            document.getElementById('content').innerHTML = '<h2>Inicio</h2><p>Este es el contenido de la página de inicio.</p>';
        }

        function showAbout() {
            document.getElementById('content').innerHTML = '<h2>Acerca de</h2><p>Esta es la página que te cuenta sobre nosotros.</p>';
        }
    </script>
</center>
</body>
</html>
