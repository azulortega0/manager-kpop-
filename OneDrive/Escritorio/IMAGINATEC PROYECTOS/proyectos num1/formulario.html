<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Simple Ortrega Romero</title>
    <style>
        body{
            background-color: rgb(123, 208, 219); /* Color de fondo */
            font-family: Arial, sans-serif; /* Tipo de letra */
            text-align: center; /* Alineación del texto */
        }
        h1 {
            color: rgb(15, 29, 218); /* Color del encabezado */
        }
        label{
            color: rgb(15, 4, 75);
        }
        button{
            color: rgb(0, 0, 0);
        }
        
    </style>
</head>
<body>
    <center>
        <h1>Formulario de Registro de Azul Ortega</h1>
    <form action="#" method="post">
        <label for="nombre">Ingrese Tu Nombre:</label><br>
        <input type="text" id="nombre" name="nombre" required><br><br>
<label for="correo">Ingrese Su Correo:</label><br>
        <input type="email" id="correo" name="correo" required><br><br>

        <button type="submit">Enviar</button>
    </center>
    
    </form>
</body>
</html>
