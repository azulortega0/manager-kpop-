<!DOCTYPE html>
<html>
<head>
    <title>Modificar Elementos del DOM</title>
    <style>
        .resaltado {    
            color: rgb(88, 71, 129);
            font-weight: bold;
        }
    </style>
</head>
<body>
<center>
<h1 id="titulo">Hola equipo de Front-End!</h1>
<button id="cambiarTexto">Cambiar Texto</button>

<script>
    // Seleccionamos el elemento h1
    const titulo = document.getElementById('titulo');

    // Función para cambiar el texto y el estilo
    function cambiarElemento() {
        titulo.textContent = 'Se cambio el texto a color morado';
        titulo.classList.add('resaltado'); // Agrega la clase 'resaltado'
    }

    // Agregamos un evento de clic al botón
    const boton = document.getElementById('cambiarTexto');
    boton.addEventListener('click', cambiarElemento);
</script>
</center>
</body>
</html>
